<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Grand+Hotel&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1F44; --navy-2:#13306A; --blue:#0057B8; --blue-2:#1A73D9; --silver:#C9D1DC; --silver-2:#EEF2F7;
  --ink:#152033; --muted:#6B778C; --line:#E4E8F0; --bg-page:#24272D;
  --ok:#1E8E4E; --ok-bg:#E8F6EE; --warn:#B26A00; --warn-bg:#FFF5E5; --bad:#C62828; --bad-bg:#FDECEC;
  --meta:#0866FF; --fs:#0E2A6B;
  --wa-dark:#075E54; --wa-head:#008069; --wa-bg:#ECE5DD; --wa-out:#D9FDD3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg-page);font-family:'Roboto',system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
svg{display:block}

/* ── Loader ─────────────────────────────── */
#loader{position:fixed;inset:0;z-index:100;background:radial-gradient(70% 60% at 50% 40%,#13306A 0%,#0A1F44 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#fff;transition:opacity .6s ease,visibility .6s}
#loader.done{opacity:0;visibility:hidden}
#loader .dp{width:132px;height:132px;border-radius:50%;background:var(--navy);box-shadow:0 0 0 2px rgba(255,255,255,.12),0 18px 50px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;animation:breathe 2.4s ease-in-out infinite}
#loader .dp img{width:100px}
#loader .eb{font-size:13px;letter-spacing:5px;opacity:.6;text-transform:uppercase}
#loader .bar{width:240px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8FB5E8,#fff);transition:width .25s}
#loader .pw{position:absolute;bottom:36px;display:flex;align-items:center;gap:10px;font-size:12px;opacity:.75;letter-spacing:.5px}
#loader .pw img{height:16px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* ── App shell ──────────────────────────── */
#app{height:100vh;display:flex;flex-direction:column;padding:14px 22px 10px;gap:10px;color:#f2f4f8}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:14px}
.brand .dp{width:42px;height:42px;border-radius:50%}
.brand .eb{font-size:10px;letter-spacing:2px;opacity:.5;text-transform:uppercase}
.brand .tt{font-size:23px;font-weight:300;letter-spacing:4px;margin-top:2px}
.brand .tt span{opacity:.4;letter-spacing:2px}
.pw-top{display:flex;align-items:center;gap:10px;font-size:11px;opacity:.75;letter-spacing:.4px}
.pw-top img{height:17px}

.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;flex-shrink:0}
.st{position:relative;height:40px;border-radius:7px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:9px;padding:0 12px;text-align:left;transition:background .25s;overflow:hidden}
.st:hover{background:rgba(255,255,255,.12)}
.st .n{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:all .25s}
.st .l{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7}
.st .f{position:absolute;left:0;bottom:0;height:3px;background:var(--blue-2);width:0;transition:width .35s}
.st.done .n{background:rgba(255,255,255,.85);border-color:transparent;color:var(--navy)}
.st.done .l{opacity:.85}
.st.done .f{width:100%;background:rgba(255,255,255,.35)}
.st.on{background:var(--blue)}
.st.on .n{background:#fff;color:var(--blue);border-color:#fff}
.st.on .l{opacity:1;font-weight:700}
.st.on .f{background:#fff}

#stageWrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;width:1280px;height:820px;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;transform-origin:center center}

.nav{flex-shrink:0;display:flex;flex-direction:column;gap:7px}
.subs{display:flex;gap:3px}
.subs button{flex:1;height:22px;border-radius:3px;background:rgba(255,255,255,.08);color:#fff;font-size:9px;font-weight:600;transition:background .2s}
.subs button.past{background:rgba(255,255,255,.3)}
.subs button.on{background:var(--blue-2)}
.subs button.gap{margin-left:6px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.navbtn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;padding:7px 16px;border-radius:6px;font-size:12px;font-weight:500}
.navbtn:disabled{opacity:.3;cursor:not-allowed}
.navbtn.primary{background:var(--blue);border-color:var(--blue)}
.navbtn svg{width:14px;height:14px}
.hint{font-size:10.5px;opacity:.5;font-family:ui-monospace,monospace;text-align:center}
.hint b{font-weight:600;opacity:1}
.foot{display:flex;align-items:center;gap:8px;font-size:10.5px;opacity:.45;justify-content:center}
.foot img{height:12px}

/* ── Stage furniture ────────────────────── */
.eyebrow{position:absolute;top:18px;font-size:11px;font-weight:700;color:#8C96A8;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--blue)}
#ebLeft{left:40px}
.persona{position:absolute;top:10px;right:36px;display:flex;align-items:center;gap:9px;background:#F3F6FA;border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px}
.persona img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.persona b{font-size:12.5px;color:var(--ink)}
.persona span{font-size:11.5px;color:var(--muted)}
.caption{position:absolute;left:40px;bottom:14px;display:none}

/* ── Panel frame (reference style) ──────── */
.panel{position:absolute;left:36px;top:52px;width:812px;height:748px;border-radius:12px;border:5px solid var(--navy);background:#fff;overflow:hidden}
.ph{height:70px;padding:0 22px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 4px rgba(0,0,0,.06);position:relative;z-index:2;background:#fff}
.ph .ic{width:40px;height:40px;border-radius:50%;background:#F0F5FC;border:1.5px solid var(--navy);display:flex;align-items:center;justify-content:center;color:var(--navy);flex-shrink:0}
.ph .ic svg{width:20px;height:20px}
.ph .ic.meta{border-color:var(--meta);color:var(--meta);background:#EEF4FF}
.ph .ic.fs{border-color:var(--fs);color:var(--fs)}
.ph .tt{font-size:19px;font-weight:600;color:var(--ink)}
.ph .sb{font-size:11.5px;color:var(--muted);margin-top:2px}
.ph .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:10.5px;color:#555;font-family:ui-monospace,monospace;letter-spacing:.5px}
.ph .live i{width:8px;height:8px;border-radius:50%;background:#4CC17A;animation:blink 1.4s infinite}
.pb{position:absolute;top:70px;left:0;right:0;bottom:0;padding:18px 22px;overflow:hidden}

.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(13,42,107,.05)}
.card-h{padding:11px 16px;border-bottom:1px solid #EEF1F6;font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.card-h>svg{width:15px;height:15px;color:var(--blue);flex-shrink:0}
.card-h .r{margin-left:auto;font-weight:500;color:var(--muted);font-size:11px}
.lbl{font-size:10.5px;font-weight:700;color:var(--navy);letter-spacing:.6px;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:500;background:#EEF3FA;color:#1F3354;white-space:nowrap}
.chip.blue{background:#E6F0FF;color:#0B4FB3}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip svg{width:12px;height:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.6px}
.pill.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #BFE5CB}
.pill.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #F3D9A8}
.pill.bad{background:var(--bad-bg);color:var(--bad);border:1px solid #F5C6C6}
.pill.blue{background:#E6F0FF;color:#0B4FB3;border:1px solid #C3D9FB}
.callout{border-radius:10px;padding:14px 16px;background:linear-gradient(100deg,var(--navy),var(--blue));color:#fff;display:flex;align-items:center;gap:14px}
.callout svg{width:26px;height:26px;flex-shrink:0;opacity:.9}
.callout b{display:block;font-size:15px;margin-bottom:2px}
.callout span{font-size:12px;opacity:.85}
.kpi{padding:14px 14px 12px}
.kpi .v{font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{font-size:11px;color:var(--muted);margin-top:4px}
.tick{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#E9EDF3;color:#A3AEC2;transition:all .3s}
.tick svg{width:13px;height:13px}
.tick.on{background:var(--ok);color:#fff}
.tick.x{background:var(--bad);color:#fff}

/* animations */
.fi{animation:fadeInUp .45s both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(26,115,217,.55)}70%{box-shadow:0 0 0 14px rgba(26,115,217,0)}100%{box-shadow:0 0 0 0 rgba(26,115,217,0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.shim{height:12px;border-radius:4px;background:linear-gradient(90deg,#f0f4fa,#dce5f2,#f0f4fa);background-size:200% 100%;animation:shimmer 2.2s linear infinite}

/* ── Phone ──────────────────────────────── */
.phone{position:absolute;left:884px;top:50px;width:356px;height:740px;border-radius:58px;background:#0E0F12;padding:11px;box-shadow:0 0 0 2px #2C2F36,0 0 0 3px #50545D,0 24px 50px rgba(0,0,0,.28)}
.phone::before{content:"";position:absolute;left:-3px;top:150px;width:3px;height:60px;border-radius:2px;background:#3A3D44;box-shadow:0 80px 0 #3A3D44}
.phone::after{content:"";position:absolute;right:-3px;top:190px;width:3px;height:90px;border-radius:2px;background:#3A3D44}
.screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:#000;cursor:pointer}
.island{position:absolute;top:10px;left:50%;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000;z-index:40}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;padding:0 28px 0 34px;display:flex;align-items:center;justify-content:space-between;z-index:30;font-size:15px;font-weight:600;color:#fff;pointer-events:none}
.sbar.dark{color:#111}
.sbar .ics{display:flex;align-items:center;gap:5px}
.sbar svg{height:12px;width:auto}
.homebar{position:absolute;bottom:7px;left:50%;width:124px;height:5px;margin-left:-62px;border-radius:3px;background:rgba(255,255,255,.85);z-index:30;pointer-events:none}
.homebar.dark{background:rgba(0,0,0,.8)}
.app{position:absolute;inset:0}
[data-tap]{position:relative}
.tapdot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:tapPulse 1.6s ease-out infinite;pointer-events:none;z-index:50}
@keyframes tapPulse{0%{transform:scale(.6);opacity:1;box-shadow:0 0 0 0 rgba(26,115,217,.6)}70%{transform:scale(1);opacity:.9;box-shadow:0 0 0 16px rgba(26,115,217,0)}100%{transform:scale(.6);opacity:1}}
.taphint{position:absolute;right:40px;bottom:6px;font-size:11px;color:#8C96A8;display:flex;align-items:center;gap:6px}
.taphint svg{width:14px;height:14px}

/* Instagram Reels */
.ig{background:#000;color:#fff}
.ig .media{position:absolute;inset:0}
.ig .media video,.ig .media img{width:100%;height:100%;object-fit:cover}
.ig .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%);pointer-events:none}
.ig .hdr{position:absolute;top:52px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:700;z-index:5}
.ig .hdr svg{width:24px;height:24px}
.ig .rail{position:absolute;right:10px;bottom:132px;display:flex;flex-direction:column;align-items:center;gap:17px;z-index:5}
.ig .rail .i{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);transition:transform .2s}
.ig .rail svg{width:27px;height:27px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));transition:all .25s}
.ig .rail .on svg{transform:scale(1.15)}
.ig .rail .like.on svg{fill:#FF3040;stroke:#FF3040}
.ig .rail .save.on svg{fill:#fff}
.ig .rail .aud{width:28px;height:28px;border-radius:7px;border:2px solid #fff;overflow:hidden}
.ig .rail .aud img{width:100%;height:100%}
.ig .meta{position:absolute;left:14px;right:64px;bottom:96px;z-index:5}
.ig .who{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700}
.ig .who img{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8)}
.ig .verified{width:13px;height:13px;margin-left:-4px}
.ig .follow{font-size:12px;font-weight:600;border:1.3px solid rgba(255,255,255,.85);border-radius:8px;padding:4px 11px;transition:all .3s}
.ig .follow.on{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35)}
.ig .cap{margin-top:9px;font-size:12.5px;line-height:1.4;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ig .spons{margin-top:6px;font-size:11.5px;opacity:.9;display:flex;align-items:center;gap:6px}
.ig .spons svg{width:12px;height:12px}
.ig .cta{position:absolute;left:12px;right:12px;bottom:56px;height:38px;border-radius:9px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13.5px;font-weight:600;z-index:6}
.ig .cta.white{background:#fff;color:var(--navy);animation:pulseRing 1.8s infinite}
.ig .cta svg{width:16px;height:16px}
.ig .prog{position:absolute;left:0;right:0;bottom:50px;height:3px;background:rgba(255,255,255,.25);z-index:6}
.ig .prog i{display:block;height:100%;background:#fff;width:0}
.ig .tabbar{position:absolute;left:0;right:0;bottom:0;height:50px;background:#000;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:7}
.ig .tabbar svg{width:23px;height:23px}
.ig .tabbar img{width:24px;height:24px;border-radius:50%}
.ig .bigheart{position:absolute;left:50%;top:44%;width:96px;height:96px;margin:-48px 0 0 -48px;z-index:8;opacity:0;pointer-events:none}
.ig .bigheart.go{animation:heartPop .9s ease-out}
@keyframes heartPop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.15)}45%{transform:scale(.95)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1) translateY(-20px)}}
.ig .toast{position:absolute;left:14px;right:14px;top:100px;background:rgba(38,38,38,.95);border-radius:10px;padding:11px 14px;font-size:13px;display:flex;align-items:center;gap:10px;z-index:9;opacity:0;transform:translateY(-10px);transition:all .3s}
.ig .toast.on{opacity:1;transform:none}
.ig .toast svg{width:18px;height:18px}
.ig .sheet{position:absolute;left:0;right:0;bottom:0;background:#262626;border-radius:16px 16px 0 0;padding:10px 16px 28px;z-index:10;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.ig .sheet.on{transform:none}
.ig .sheet .grab{width:38px;height:4px;border-radius:2px;background:#555;margin:0 auto 12px}
.ig .sheet .srch{background:#3A3A3A;border-radius:9px;padding:8px 12px;font-size:12.5px;color:#aaa;margin-bottom:14px}
.ig .sheet .ppl{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;font-size:10.5px}
.ig .sheet .ppl img{width:54px;height:54px;border-radius:50%;margin:0 auto 5px;object-fit:cover}
.ig .sheet .ppl .sel img{box-shadow:0 0 0 3px #262626,0 0 0 5px #0095F6}
.ig .sheet .send{margin-top:14px;background:#0095F6;border-radius:9px;text-align:center;padding:10px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .25s}
.ig .sheet .send.on{opacity:1}

/* Browser + FreeStand sampling site */
.web{background:#fff;color:var(--ink)}
.urlbar{position:absolute;top:48px;left:0;right:0;height:46px;background:#F2F3F5;border-bottom:1px solid #E1E4E9;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:5}
.urlbar .u{flex:1;height:32px;border-radius:16px;background:#fff;border:1px solid #E1E4E9;display:flex;align-items:center;gap:7px;padding:0 12px;font-size:13px;color:#333}
.urlbar .u svg{width:12px;height:12px;color:#2E7D32}
.urlbar .u span{color:#888}
.urlbar>svg{width:18px;height:18px;color:#555}
.page{position:absolute;top:94px;left:0;right:0;bottom:0;overflow:hidden;display:flex;flex-direction:column}
.page.anim .pin{animation:slideIn .4s both}
.lph{height:50px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
.lph img{height:16px}
.lph span{font-size:10.5px;color:#9FB4D6;letter-spacing:1.5px;font-weight:600;text-transform:uppercase}
.lprog{height:4px;background:#E6EBF2;flex-shrink:0}
.lprog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-2));transition:width .5s}
.pin{flex:1;padding:20px 20px 0;display:flex;flex-direction:column;min-height:0}
.pin h2{font-family:'Barlow',sans-serif;font-weight:800;font-size:25px;line-height:1.08;color:var(--navy);letter-spacing:-.2px}
.pin .sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.pin .qn{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px}
.fld{margin-top:16px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:#55617A;margin-bottom:6px}
.inp{height:46px;border-radius:10px;border:1.5px solid #D5DCE6;display:flex;align-items:center;padding:0 14px;font-size:15px;color:var(--ink);gap:10px;background:#fff}
.inp.focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,87,184,.12)}
.inp .pre{color:#55617A;border-right:1px solid #D5DCE6;padding-right:10px;font-weight:500}
.inp .ok{margin-left:auto;color:var(--ok)}
.inp .ok svg{width:18px;height:18px}
.otp{display:flex;gap:8px;margin-top:10px}

.fr .bar{height:30px;border-radius:6px;background:#EEF2F7;overflow:hidden}

/* Qualification engine */
.eng{display:grid;grid-template-columns:1fr 300px;gap:16px;height:100%}
.eng .col{display:flex;flex-direction:column;gap:12px;min-height:0}
.score{display:flex;align-items:center;gap:20px;padding:16px 18px}
.ring{position:relative;width:132px;height:132px;flex-shrink:0}

.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:40px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.ring .num span{font-size:11px;color:var(--muted);margin-top:2px}
.ring circle{fill:none;stroke-width:11}
.ring .tr{stroke:#EEF2F7}
.ring .fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),stroke .4s}

.score .st2{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}

.lr .src{font-size:10.5px;color:var(--muted);margin-top:1px}
.lr.new{background:#F5F9FF}
.rule{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:12px;color:var(--ink)}
.rule .d{font-size:10.5px;color:var(--muted)}
.prof .f{display:flex;align-items:center;gap:10px;padding:5px 14px;border-bottom:1px solid #F2F4F8;font-size:12px}
.prof .f:last-child{border-bottom:none}
.prof .f .k{width:66px;color:var(--muted);flex-shrink:0}
.prof .f .v{font-weight:600;color:var(--ink)}
.prof .f .shim{flex:1}
.ctx{padding:12px 14px}
.ctx .mini{margin-top:8px;background:#F6F8FB;border:1px solid #E6EAF1;border-radius:8px;padding:9px 11px;font-size:11.5px;color:#3F4B60;line-height:1.45}
.rej{display:flex;align-items:center;gap:10px;margin-top:6px}
.rej img{width:38px;height:38px;border-radius:50%;object-fit:cover;filter:grayscale(.3)}
.rej .t{font-size:12.5px;font-weight:700;color:var(--ink)}

.rejrows div b.g{color:var(--ok)}

.road{position:relative;height:120px;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#CFE2F7 0%,#E5EFFA 58%,#9AA6B4 58%,#8B97A6 100%)}

.road .hub{position:absolute;left:30px;top:30px;font-size:10px;font-weight:700;color:#3A4C66;background:#fff;padding:4px 8px;border-radius:6px;letter-spacing:.4px}
.truck{position:absolute;top:44px;left:40px;width:84px;transition:left 2.2s cubic-bezier(.4,.1,.3,1)}
.tl{display:grid;grid-template-columns:repeat(4,1fr);position:relative;padding:18px 6px 6px}
.tl::before{content:"";position:absolute;left:12.5%;right:12.5%;top:33px;height:3px;background:#E3E8F0}
.tl .ln{position:absolute;left:12.5%;top:33px;height:3px;background:var(--ok);transition:width 1.2s ease;width:0}

.tl .nd b{display:block;font-size:12.5px;margin-top:8px;color:var(--ink)}
.tl .nd span{font-size:10.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bars2 .r{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:12px;padding:5px 0}
.bars2 .r .bar{height:12px;border-radius:6px;background:#EEF2F7;overflow:hidden}
.bars2 .r .bar i{display:block;height:100%;border-radius:6px;background:var(--blue);width:0;transition:width 1s ease}
.bars2 .r b{text-align:right;font-variant-numeric:tabular-nums}

/* Feedback */
.split{display:flex;height:34px;border-radius:8px;overflow:hidden}

.legend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--muted)}

/* UGC wall */

.ugcT .vw svg{width:14px;height:14px}
.ugcT .newb{position:absolute;top:8px;left:8px;background:var(--ok);color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;letter-spacing:.5px;animation:popIn .4s .3s both}

.mosaic{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;align-content:start}
.mosaic img{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover}
.mosaic .more{aspect-ratio:1;border-radius:8px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.mosaic .more small{font-size:10px;font-weight:500;opacity:.7}

/* Closing */
.close{position:absolute;inset:0;background:radial-gradient(90% 80% at 85% 0%,#13306A 0%,#0A1F44 55%,#071631 100%);color:#fff;padding:36px 56px}

.close .chain span{opacity:0;animation:fadeInUp .5s both}

.cgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;margin-top:26px}
.cf{display:flex;flex-direction:column;gap:15px}
.cf .r{display:grid;grid-template-columns:170px 1fr 92px;align-items:center;gap:12px}

.cta-row{display:flex;align-items:center;gap:16px;margin-top:22px}
.bigcta{display:inline-flex;align-items:center;gap:14px;background:#fff;color:var(--navy);border-radius:999px;padding:14px 26px;font-family:'Barlow',sans-serif;font-weight:800;font-size:20px;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:pulseRing 2s infinite}
.bigcta img{height:18px}
.bigcta svg{width:20px;height:20px}
.ghost{color:#A9C4EA;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.ghost svg{width:14px;height:14px}
.close .logos{display:flex;align-items:center;gap:14px}

.close .logos img.f{height:22px}

let timers = [];
const later = (ms, fn) => timers.push(setTimeout(fn, ms));
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

function countUp(el, from, to, dur = 1200, fmt = inr) {
  if (!el) return;
  const t0 = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (p < 1 && el.isConnected) requestAnimationFrame(tick);

}
function animateCounters(root, fromMap = {}) {
  root.querySelectorAll('[data-count]').forEach(el => {

    countUp(el, from, to, +(el.dataset.dur || 1300), fmt);
  });

let idx = 0, lastIdx = -1;
try { const v = parseInt(localStorage.getItem('gillette-stage') || '0', 10); if (!isNaN(v)) idx = Math.min(Math.max(0, v), STAGES.length - 1); } catch (e) {}
const hashIdx = parseInt((location.hash.match(/s=(\d+)/) || [])[1], 10);
if (!isNaN(hashIdx)) idx = Math.min(Math.max(0, hashIdx - 1), STAGES.length - 1);

function buildNav() {
  $('#steps').innerHTML = STEPS.map((n, i) => `<button class="st" data-step="${i + 1}"><span class="n">${i + 1}</span><span class="l">${n}</span><span class="f"></span></button>`).join('');
  $('#subs').innerHTML = STAGES.map((s, i) => `<button title="${s.label}" data-i="${i}" class="${i > 0 && STAGES[i - 1].step !== s.step ? 'gap' : ''}">${String(i + 1).padStart(2, '0')}</button>`).join('');
  $('#steps').addEventListener('click', e => { const b = e.target.closest('.st'); if (b) go(STAGES.findIndex(s => s.step === +b.dataset.step)); });
  $('#subs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); });
  $('#prev').onclick = () => go(idx - 1);
  $('#next').onclick = () => go(idx + 1);
}
function updateNav() {
  const s = STAGES[idx];
  document.querySelectorAll('.st').forEach(b => {
    const n = +b.dataset.step;
    b.classList.toggle('on', n === s.step);
    b.classList.toggle('done', n < s.step);
    if (n === s.step) {
      const inStep = STAGES.filter(x => x.step === n), pos = inStep.indexOf(s);
      b.querySelector('.f').style.width = ((pos + 1) / inStep.length * 100) + '%';
    } else b.querySelector('.f').style.width = '';
  });
  document.querySelectorAll('#subs button').forEach((b, i) => { b.classList.toggle('on', i === idx); b.classList.toggle('past', i < idx); });
  $('#prev').disabled = idx === 0;
  $('#next').disabled = idx === STAGES.length - 1;
}

function render() {
  clearTimers();
  const s = STAGES[idx], prev = lastIdx >= 0 ? STAGES[lastIdx] : null;
  const forward = lastIdx < idx;
  const pPrev = forward && prev && lastIdx === idx - 1 ? prev : null; // only animate deltas when stepping forward by one

  if (s.app === 'close') {
    stageEl.innerHTML = closingScreen();
    animateCounters(stageEl); growBars(stageEl);
    $('#restart').onclick = () => go(0);
    $('#runCta').onclick = () => window.open('https://freestand.in', '_blank', 'noopener');
  } else {
    let phoneHtml = '';
    if (s.app === 'reels') phoneHtml = reelsApp(s);
    if (s.app === 'web') phoneHtml = webApp(s, forward);
    if (s.app === 'wa') phoneHtml = waApp(s);
    if (s.app === 'ugc') phoneHtml = ugcApp();

    let panelHtml = '';
    if (s.panel === 'adset') panelHtml = panelAdset();
    if (s.panel === 'audience') panelHtml = panelAudience(s, pPrev);
    if (s.panel === 'retarget') panelHtml = panelRetarget();
    if (s.panel === 'engine') panelHtml = panelEngine(s, pPrev);
    if (s.panel === 'delivery') panelHtml = panelDelivery(s, pPrev);
    if (s.panel === 'feedback') panelHtml = panelFeedback(s, pPrev);
    if (s.panel === 'ugc') panelHtml = panelUgc(s, pPrev);

    stageEl.innerHTML = `
      <div class="eyebrow" id="ebLeft"><span class="dot"></span>Behind the scenes · ${s.side}</div>
      <div class="persona"><img src="${A('rohan-avatar')}" alt=""><b>Rohan, 19</b><span>College student, Pune · uses a trimmer</span></div>
      <div class="panel ${['adset', 'audience', 'retarget'].includes(s.panel) ? 'bare' : ''}" id="panel">${panelHtml}</div>
      <div class="phone"><div class="island"></div><div class="screen" id="screen">${phoneHtml}</div></div>
      <div class="taphint">${I.tap}Tap the phone to continue</div>`;

    const panel = $('#panel'), screen = $('#screen');
    animateCounters(panel); growBars(panel);
    if (s.panel === 'adset') afterAdset(panel);
    if (s.panel === 'audience') afterAudience(panel, s, pPrev);
    if (s.panel === 'retarget') afterRetarget(panel);
    if (s.panel === 'engine') afterEngine(panel, s, pPrev);
    if (s.panel === 'delivery') afterDelivery(panel, s, pPrev);

    if (s.app === 'reels') afterReels(screen, s, pPrev);
    if (s.app === 'wa') afterWa(screen, s, pPrev);
    placeTapDot(screen);
    screen.addEventListener('click', () => go(idx + 1));
  }
  updateNav();
  lastIdx = idx;
  try { localStorage.setItem('gillette-stage', String(idx)); } catch (e) {}
  history.replaceState(null, '', '#s=' + (idx + 1));
}

function afterReels(screen, s, prev) {
  const slot = $('.vslot', screen);
  if (slot) { slot.appendChild(reelVideo); reelVideo.play().catch(() => {}); }
  else reelVideo.pause();
  const prog = $('#igProg', screen);
  const like = $('#igLike', screen), save = $('#igSave', screen), follow = $('#igFollow', screen);
  if (s.ad !== 'edu') { prog.style.width = '6%'; return; }
  const setProg = (w, dur) => { prog.style.transition = dur ? `width ${dur}ms linear` : 'none'; prog.style.width = w; };
  if (!s.anim) { setProg('12%'); requestAnimationFrame(() => requestAnimationFrame(() => setProg('30%', 5000))); }
  if (s.anim === 'watch') { setProg('30%'); requestAnimationFrame(() => requestAnimationFrame(() => setProg('78%', 2600))); }
  if (s.anim === 'engage') {
    setProg('78%'); requestAnimationFrame(() => requestAnimationFrame(() => setProg('96%', 4200)));
    later(250, () => { like.classList.add('on'); $('#igLikeN', screen).textContent = '24.7K'; $('.bigheart', screen).classList.add('go'); });
    later(1100, () => { save.classList.add('on'); $('#igToast', screen).classList.add('on'); });
    later(1900, () => $('#igToast', screen).classList.remove('on'));
    later(1900, () => $('#igSheet', screen).classList.add('on'));
    later(2400, () => $('#igSend', screen).classList.add('on'));
    later(2900, () => { $('#igSend', screen).textContent = 'Sent'; });
    later(3200, () => $('#igSheet', screen).classList.remove('on'));
    later(3400, () => { follow.classList.add('on'); follow.textContent = 'Following'; });
  }
}
function afterWa(screen, s, prev) {
  const chat = $('#chat', screen);
  const prevWa = prev && prev.app === 'wa' ? prev.wa : (prev ? 0 : 99);
  const items = [...chat.querySelectorAll('.wm')];
  let n = 0;
  items.forEach(el => {
    const from = WA[+el.dataset.i][0];
    if (from > prevWa) { el.classList.add('fi'); el.style.animationDelay = (0.15 + n++ * 0.45) + 's'; }
  });
  chat.scrollTop = chat.scrollHeight;
  if (n) {
    // keep scrolled to bottom while new messages land
    for (let k = 1; k <= n + 1; k++) later(k * 450, () => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' }));
  }
}
function placeTapDot(screen) {
  const targets = screen.querySelectorAll('[data-tap]');
  const t = targets[targets.length - 1];
  if (!t) return;
  later(700, () => {
    const r = t.getBoundingClientRect(), sr = screen.getBoundingClientRect();
    const scale = sr.width / screen.offsetWidth;
    const dot = document.createElement('div'); dot.className = 'tapdot';
    const first = t.classList.contains('qr') ? t.firstElementChild : t;
    const fr = first.getBoundingClientRect();
    dot.style.left = ((fr.left + fr.width * 0.72 - sr.left) / scale) + 'px';
    dot.style.top = ((fr.top + fr.height / 2 - sr.top) / scale) + 'px';
    screen.appendChild(dot);
  });
}

function go(i) {
  if (i < 0 || i >= STAGES.length || i === idx) return;
  idx = i; render();
}
document.addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { go(idx + 1); e.preventDefault(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { go(idx - 1); e.preventDefault(); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(STAGES.length - 1);
});

/* fit 1280x820 stage into available space */
function fit() {
  const w = $('#stageWrap');
  const sc = Math.min(w.clientWidth / 1280, w.clientHeight / 820);
  stageEl.style.transform = `scale(${sc})`;
}
window.addEventListener('resize', fit);

/* ═══════════════ loader: preload, then start ═══════════════ */
const PRELOAD = ['sample-ad-9x16', 'sample-ad-1x1', 'landing-hero', 'reel-cover', 'sample-kit', 'delivery', 'unboxing', 'ugc-1', 'ugc-2', 'ugc-3',
  'guard-3in1-pack', 'guard-3in1-refill', 'rohan-avatar', 'gillette-ig-dp', 'gillette-logo-white', 'freestand-logo', 'freestand-logo-white',
  'avatar-1', 'avatar-2', 'avatar-3', 'avatar-4', 'avatar-5', 'avatar-6'].map(A);
function boot() {
  let done = 0;
  const bar = $('#lbar');
  const tick = () => { done++; bar.style.width = (done / (PRELOAD.length + 1) * 100) + '%'; };
  const imgs = PRELOAD.map(src => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => { tick(); res(); }; im.src = src; }));
  const vid = new Promise(res => { const t = setTimeout(res, 2500); reelVideo.addEventListener('loadeddata', () => { clearTimeout(t); res(); }, { once: true }); reelVideo.load(); }).then(tick);
  const minTime = new Promise(res => setTimeout(res, 900));
  Promise.all([...imgs, vid, minTime, document.fonts ? document.fonts.ready : null]).then(() => {
    bar.style.width = '100%';
    setTimeout(() => { $('#loader').classList.add('done'); }, 250);
  });
  buildNav(); fit(); render();
}
boot();
</script>
