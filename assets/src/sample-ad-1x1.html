<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1080px; height: 1080px; }
  .logo { position: absolute; top: 80px; left: 80px; }
  .logo img { width: 250px; }
  .eyebrow { position: absolute; top: 200px; left: 80px; font-size: 22px; color: #A9C4EA; }
  .headline { position: absolute; top: 250px; left: 80px; width: 560px; font-size: 76px; }
  .headline em { font-style: italic; font-weight: 900; display: block; margin-top: 12px;
    background: linear-gradient(180deg, #FFFFFF 0%, #C9D9F2 100%); -webkit-background-clip: text; color: transparent; }
  .sub { position: absolute; top: 560px; left: 80px; width: 470px; font-size: 32px; line-height: 1.3; color: #DCE7F7; }
  .sub b { color: #fff; }
  .ctawrap { position: absolute; top: 760px; left: 80px; }
  .cta { font-size: 38px; padding: 24px 46px; }
  .cta svg { width: 32px; height: 32px; }
  .fine { position: absolute; bottom: 70px; left: 80px; font-size: 20px; color: #9DB6DA; }
  .glow { left: 520px; top: 200px; width: 620px; height: 620px; }
  .pack { position: absolute; left: 500px; top: 210px; width: 560px; }
  .gel { position: absolute; left: 820px; top: 430px; width: 260px; transform: rotate(10deg); }
  .free { position: absolute; left: 560px; top: 150px; width: 150px; height: 150px; border-radius: 50%;
    background: linear-gradient(160deg, #FFFFFF 0%, #DCE4EE 100%); color: var(--navy); transform: rotate(-12deg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 18px 40px rgba(0,0,0,0.4); }
  .free .a { font-family: 'Barlow'; font-weight: 900; font-size: 48px; line-height: 0.9; font-style: italic; }
  .free .b { font-family: 'Barlow'; font-weight: 700; font-size: 16px; letter-spacing: 0.18em; margin-top: 4px; }
</style></head>
<body>
<div class="canvas bg-gillette streaks">
  <div class="logo"><img src="../gillette-logo-white.png" alt="Gillette"></div>
  <div class="eyebrow">For first-time shavers</div>
  <div class="headline display">You learnt the technique.<em>Now try it free.</em></div>
  <div class="sub">Claim your <b>Gillette Fusion5</b> sample</div>
  <div class="ctawrap"><span class="cta">Claim Free Sample
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
  <div class="fine">Limited kits. One per household. Delivered free.</div>
  <div class="glow"></div>
  <img class="pack shadow-prod" src="../fusion5-pack.png" alt="">
  <img class="gel shadow-prod" src="../fusion-gel.png" alt="">
  <div class="free"><div class="a">FREE</div><div class="b">SAMPLE</div></div>
</div>
</body></html>
