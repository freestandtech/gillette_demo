<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* 1080x1080. Add ?cutout to render the kit alone on a transparent background (used by unboxing.html) */
  .canvas { width: 1080px; height: 1080px; }
  .surface { position: absolute; inset: 0;
    background: radial-gradient(80% 70% at 50% 45%, #F4F6FA 0%, #DDE3EC 70%, #C9D1DC 100%); }
  .cutout .surface, .cutout .floor-shadow { display: none; }

  .kit { position: absolute; left: 160px; top: 140px; width: 760px; height: 820px; }
  .floor-shadow { position: absolute; left: 10px; right: -10px; top: 300px; height: 540px; border-radius: 40px;
    background: rgba(10,31,68,0.35); filter: blur(38px); }

  /* lid, opened back, seen in perspective */
  .lid { position: absolute; left: 0; top: 0; width: 760px; height: 300px;
    clip-path: polygon(0 0, 100% 0, 97.5% 100%, 2.5% 100%);
    background: linear-gradient(180deg, #14336B 0%, #0A1F44 100%); }
  .lid::after { content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,0) 0 30px, rgba(255,255,255,0.05) 30px 32px); }
  .lid .inner { position: absolute; left: 6%; right: 6%; top: 22px; bottom: 18px;
    clip-path: polygon(0 0, 100% 0, 98% 100%, 2% 100%);
    background: linear-gradient(180deg, #0D2552 0%, #0B2148 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .lid .inner img { width: 300px; opacity: 0.96; }
  .lid .inner .tag { font-family: 'Barlow'; font-weight: 600; font-size: 20px; letter-spacing: 0.3em; color: #9FB4D6; text-transform: uppercase; }
  .hinge { position: absolute; left: 0; top: 296px; width: 760px; height: 10px; background: #071733; }

  /* box body */
  .box { position: absolute; left: 0; top: 300px; width: 760px; height: 500px; border-radius: 6px;
    background: linear-gradient(180deg, #0F2A5C 0%, #0A1F44 100%);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06); }
  .front { position: absolute; left: 0; bottom: -46px; width: 760px; height: 52px; border-radius: 0 0 10px 10px;
    background: linear-gradient(180deg, #0A1F44 0%, #06142E 100%);
    display: flex; align-items: center; justify-content: center; }
  .front img { height: 26px; opacity: 0.85; }
  .cavity { position: absolute; left: 34px; right: 34px; top: 30px; bottom: 30px; border-radius: 4px; overflow: hidden;
    background: #071733; box-shadow: inset 0 26px 40px rgba(0,0,0,0.6), inset 0 -8px 20px rgba(0,0,0,0.4); }
  /* silver crinkle tissue */
  .tissue { position: absolute; inset: 14px; border-radius: 4px;
    background:
      linear-gradient(118deg, rgba(255,255,255,0.0) 0 20%, rgba(255,255,255,0.55) 22%, rgba(255,255,255,0) 26% 44%, rgba(255,255,255,0.45) 47%, rgba(255,255,255,0) 52% 70%, rgba(255,255,255,0.5) 73%, rgba(255,255,255,0) 78%),
      linear-gradient(62deg, rgba(0,0,0,0) 0 30%, rgba(0,0,0,0.12) 33%, rgba(0,0,0,0) 38% 60%, rgba(0,0,0,0.10) 64%, rgba(0,0,0,0) 69%),
      linear-gradient(180deg, #DCE2EA 0%, #B9C3D0 100%);
    box-shadow: inset 0 18px 30px rgba(0,0,0,0.35); }

  .pack { position: absolute; left: -10px; top: -60px; width: 560px; transform: rotate(-8deg); }
  .gel { position: absolute; right: -6px; top: -14px; width: 380px; transform: rotate(16deg); }

  .card { position: absolute; left: 300px; top: 610px; width: 420px; height: 214px; transform: rotate(-4deg);
    background: linear-gradient(180deg, #FFFFFF 0%, #F1F4F8 100%); border-radius: 6px; color: var(--navy);
    box-shadow: 0 22px 40px rgba(0,0,0,0.45), 0 2px 0 rgba(0,0,0,0.06);
    padding: 24px 28px; display: flex; flex-direction: column; justify-content: space-between; }
  .card .t { font-family: 'Barlow'; font-weight: 800; font-size: 36px; line-height: 1; letter-spacing: -0.01em; }
  .card .s { font-size: 17px; color: #3A4A66; margin-top: 10px; line-height: 1.35; }
  .card .row { display: flex; align-items: center; gap: 14px; border-top: 1px solid #DCE2EA; padding-top: 14px; }
  .card .row img.g { height: 30px; }
  .card .row img.f { height: 22px; }
  .card .x { font-family: 'Barlow'; font-weight: 600; font-size: 20px; color: #8A97AD; }
</style></head>
<body>
<div class="canvas" id="c">
  <div class="surface"></div>
  <div class="kit">
    <div class="floor-shadow"></div>
    <div class="lid"><div class="inner"><img src="../gillette-logo-white.png" alt=""><div class="tag">First Shave Kit</div></div></div>
    <div class="hinge"></div>
    <div class="box">
      <div class="cavity">
        <div class="tissue"></div>
        <img class="pack shadow-prod" src="../fusion5-pack.png" alt="">
        <img class="gel shadow-prod" src="../fusion-gel.png" alt="">
      </div>
      <div class="front"><img src="../gillette-logo-white.png" alt=""></div>
    </div>
    <div class="card">
      <div>
        <div class="t">Your First Shave Kit.</div>
        <div class="s">Courtesy of Gillette x FreeStand.<br>Wet. Lather. Short, gentle strokes.</div>
      </div>
      <div class="row"><img class="g" src="../gillette-logo.png" alt=""><span class="x">x</span><img class="f" src="../freestand-logo.png" alt=""></div>
    </div>
  </div>
</div>
<script>if (location.search.includes('cutout')) document.body.classList.add('cutout');</script>
</body></html>
