<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Reel-style UGC overlay. Render with ?n=1, ?n=2, ?n=3. Copy lives in the POSTS table below. */
  .canvas { width: 1080px; height: 1920px; background: #111 center/cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.75) 100%); }
  .topbar { position: absolute; top: 60px; left: 50px; right: 50px; display: flex; justify-content: space-between; align-items: center; font-size: 46px; font-weight: 700; }
  .topbar svg { width: 54px; height: 54px; }
  .rail { position: absolute; right: 36px; bottom: 300px; display: flex; flex-direction: column; align-items: center; gap: 46px; }
  .rail .i { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 30px; font-weight: 600; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
  .rail svg { width: 72px; height: 72px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)); }
  .rail .liked svg { fill: #FF3040; stroke: #FF3040; }
  .audio { width: 74px; height: 74px; border-radius: 16px; border: 4px solid #fff; background: center/cover; }
  .meta { position: absolute; left: 44px; right: 170px; bottom: 120px; }
  .who { display: flex; align-items: center; gap: 20px; font-size: 36px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
  .who img { width: 76px; height: 76px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; }
  .follow { font-size: 28px; font-weight: 600; border: 2px solid rgba(255,255,255,0.85); border-radius: 12px; padding: 6px 18px; }
  .cap { margin-top: 24px; font-size: 36px; line-height: 1.35; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  .cap .tag { font-weight: 700; }
  .cap .h { color: #E0ECFF; }
  .tune { margin-top: 18px; font-size: 28px; display: flex; align-items: center; gap: 12px; opacity: 0.95; }
  .tune svg { width: 30px; height: 30px; }
  .sticker { position: absolute; top: 200px; left: 60px; width: 300px; padding: 18px 18px 14px; background: #fff; border-radius: 28px; transform: rotate(-8deg);
    box-shadow: 0 18px 40px rgba(0,0,0,0.35); text-align: center; color: #0A1F44; }
  .sticker img { width: 100%; display: block; }
  .sticker div { font-family: 'Barlow'; font-weight: 800; font-size: 26px; margin-top: 2px; letter-spacing: 0.02em; }
  .chiptxt { position: absolute; left: 50%; top: 1180px; transform: translateX(-50%) rotate(-2deg); background: #fff; color: #111;
    font-family: 'Roboto'; font-weight: 700; font-size: 46px; padding: 14px 28px; border-radius: 14px; white-space: nowrap; }
  .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,0.3); }
  .progress i { display: block; height: 100%; width: 38%; background: #fff; }
</style></head>
<body>
<div class="canvas" id="c">
  <div class="shade"></div>
  <div class="topbar"><span>Reels</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></div>
  <div class="sticker"><img src="../guard-3in1-pack.png" alt=""><div>Guard 3-in-1</div></div>
  <div class="chiptxt" id="chip"></div>
  <div class="rail">
    <div class="i liked"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg><span id="likes"></span></div>
    <div class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg><span id="comments"></span></div>
    <div class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M22 3 9.2 13.2M22 3l-7 19-4.8-8.8L2 9z"/></svg><span id="shares"></span></div>
    <div class="i"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
    <div class="audio" id="audio"></div>
  </div>
  <div class="meta">
    <div class="who"><img id="av" alt=""><span id="handle"></span><span class="follow">Follow</span></div>
    <div class="cap" id="cap"></div>
    <div class="tune"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span id="tune"></span></div>
  </div>
  <div class="progress"><i></i></div>
</div>
<script>
const POSTS = {
  1: { photo: '../ugc-photo-1.png', avatar: '../rohan-avatar.png', handle: 'rohan.k_19', chip: 'first shave: done',
       cap: 'Learnt from <span class="tag">@gilletteindia</span>\'s reel. First clean shave, zero cuts. <span class="h">#FirstShave #GilletteGuard3in1</span>',
       likes: '12.4K', comments: '318', shares: '1,204', tune: 'rohan.k_19 · Original audio' },
  2: { photo: '../ugc-photo-2.png', avatar: '../ugc-photo-2.png', handle: 'kabir.on.road', chip: 'tip 2 actually works',
       cap: 'Followed the 3 tips from <span class="tag">@gilletteindia</span>. Light strokes, no irritation. <span class="h">#FirstShave #GilletteGuard3in1</span>',
       likes: '8,906', comments: '214', shares: '640', tune: 'kabir.on.road · Original audio' },
  3: { photo: '../ugc-photo-3.png', avatar: '../ugc-photo-3.png', handle: 'arjun.frames', chip: 'free sample to fresh face',
       cap: 'Got the free kit, watched the <span class="tag">@gilletteindia</span> reel, nailed it in one go. <span class="h">#FirstShave #GilletteGuard3in1</span>',
       likes: '5,731', comments: '142', shares: '389', tune: 'arjun.frames · Original audio' },
};
const n = (location.search.match(/n=(\d)/) || [, '1'])[1];
const p = POSTS[n];
document.getElementById('c').style.backgroundImage = `url('${p.photo}')`;
document.getElementById('av').src = p.avatar;
document.getElementById('audio').style.backgroundImage = `url('${p.avatar}')`;
for (const k of ['handle', 'likes', 'comments', 'shares', 'tune', 'chip']) document.getElementById(k).textContent = p[k];
document.getElementById('cap').innerHTML = p.cap;
</script>
</body></html>
