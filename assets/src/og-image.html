<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1200px; height: 630px; }
  .logos { position: absolute; top: 64px; left: 72px; display: flex; align-items: center; gap: 22px; }
  .logos .g { height: 54px; }
  .logos .x { font-family: 'Barlow'; font-weight: 600; font-size: 34px; color: #8FB5E8; }
  .logos .f { height: 40px; }
  .title { position: absolute; top: 175px; left: 72px; width: 660px; font-size: 92px; }
  .title em { font-style: italic; font-weight: 900; display: block;
    background: linear-gradient(180deg, #FFFFFF 0%, #A9C4EA 100%); -webkit-background-clip: text; color: transparent; }
  .steps { position: absolute; left: 72px; bottom: 70px; display: flex; gap: 8px; width: 820px; }
  .steps span { font-family: 'Barlow'; font-weight: 700; font-size: 17px; letter-spacing: 0.08em; color: #E4EEFB;
    background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.2); padding: 8px 14px; border-radius: 999px; }
  .glow { left: 720px; top: 60px; width: 520px; height: 520px; }
  .pack { position: absolute; left: 700px; top: 40px; width: 520px; }
  .eyebrow { position: absolute; top: 140px; left: 74px; font-size: 18px; color: #A9C4EA; }
</style></head>
<body>
<div class="canvas bg-gillette streaks">
  <div class="logos"><img class="g" src="../gillette-logo-white.png" alt=""><span class="x">x</span><img class="f" src="../freestand-logo-white.png" alt=""></div>
  <div class="eyebrow">Interactive campaign demo</div>
  <div class="title display">Educate<em>to Sample</em></div>
  <div class="steps"><span>EDUCATE</span><span>ENGAGE</span><span>QUALIFY</span><span>SAMPLE</span><span>FEEDBACK</span><span>UGC</span></div>
  <div class="glow"></div>
  <img class="pack shadow-prod" src="../guard-3in1-pack.png" alt="">
</div>
</body></html>
