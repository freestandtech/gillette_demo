<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1080px; height: 1920px; }
  .logo { position: absolute; top: 120px; left: 0; right: 0; text-align: center; }
  .logo img { width: 360px; }
  .eyebrow { position: absolute; top: 290px; left: 0; right: 0; text-align: center; font-size: 30px; color: #A9C4EA; }
  .headline { position: absolute; top: 350px; left: 70px; right: 70px; text-align: center; font-size: 112px; }
  .headline em { font-style: italic; font-weight: 900; color: #fff; display: block; margin-top: 18px;
    background: linear-gradient(180deg, #FFFFFF 0%, #C9D9F2 100%); -webkit-background-clip: text; color: transparent; }
  .sub { position: absolute; top: 760px; left: 120px; right: 120px; text-align: center; font-size: 40px; line-height: 1.3; color: #DCE7F7; font-weight: 400; }
  .sub b { color: #fff; font-weight: 700; }
  .stage { position: absolute; left: 0; right: 0; top: 840px; height: 760px; }
  .glow { left: 140px; top: 60px; width: 800px; height: 640px; }
  .disc { position: absolute; left: 190px; top: 560px; width: 700px; height: 120px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,0.5), rgba(0,0,0,0)); }
  .pack { position: absolute; left: 60px; top: -10px; width: 860px; }
  .gel { position: absolute; left: 640px; top: 250px; width: 400px; transform: rotate(10deg); }
  .free { position: absolute; left: 120px; top: 60px; width: 210px; height: 210px; border-radius: 50%;
    background: linear-gradient(160deg, #FFFFFF 0%, #DCE4EE 100%); color: var(--navy); transform: rotate(-12deg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 18px 40px rgba(0,0,0,0.4); }
  .free .a { font-family: 'Barlow'; font-weight: 900; font-size: 64px; line-height: 0.9; font-style: italic; }
  .free .b { font-family: 'Barlow'; font-weight: 700; font-size: 22px; letter-spacing: 0.18em; margin-top: 6px; }
  .ctawrap { position: absolute; top: 1630px; left: 0; right: 0; text-align: center; }
  .cta { font-size: 56px; padding: 34px 70px; }
  .cta svg { width: 44px; height: 44px; }
  .fine { position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; font-size: 26px; color: #9DB6DA; letter-spacing: 0.04em; }
</style></head>
<body>
<div class="canvas bg-gillette streaks">
  <div class="logo"><img src="../gillette-logo-white.png" alt="Gillette"></div>
  <div class="eyebrow">For first-time shavers</div>
  <div class="headline display">You learnt the technique.<em>Now try it free.</em></div>
  <div class="sub">Claim your <b>Gillette Fusion5</b> sample</div>
  <div class="stage">
    <div class="glow"></div>
    <div class="disc"></div>
    <img class="pack shadow-prod" src="../fusion5-pack.png" alt="">
    <img class="gel shadow-prod" src="../fusion-gel.png" alt="">
    <div class="free"><div class="a">FREE</div><div class="b">SAMPLE</div></div>
  </div>
  <div class="ctawrap"><span class="cta">Claim Free Sample
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
  <div class="fine">Limited kits. One per household. Delivered free.</div>
</div>
</body></html>
