<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Background is a frame from gillette-education-reel.mp4 (00:30), exported to reel-frame.jpg */
  .canvas { width: 1080px; height: 1920px; background: #0A1F44 url('reel-frame.jpg') center/cover; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,31,68,0.80) 0%, rgba(10,31,68,0.15) 34%, rgba(10,31,68,0.10) 52%, rgba(10,31,68,0.92) 82%, #0A1F44 100%); }
  .logo { position: absolute; top: 150px; left: 0; right: 0; text-align: center; }
  .logo img { width: 320px; }
  .num { position: absolute; left: 90px; top: 1180px; font-family: 'Barlow'; font-weight: 900; font-style: italic; font-size: 300px; line-height: 0.8;
    background: linear-gradient(180deg, #FFFFFF 0%, #8FB5E8 100%); -webkit-background-clip: text; color: transparent; }
  .title { position: absolute; left: 290px; right: 60px; top: 1196px; font-size: 80px; }
  .title span { display: block; font-size: 44px; font-weight: 600; letter-spacing: 0.02em; margin-top: 16px; color: #CFE0F7; }
  .bar { position: absolute; left: 90px; right: 90px; top: 1530px; height: 3px; background: linear-gradient(90deg, #0057B8, #8FB5E8, rgba(255,255,255,0)); }
  .tips { position: absolute; left: 90px; right: 90px; top: 1570px; display: flex; gap: 20px; }
  .tip { flex: 1; border: 1.5px solid rgba(207,224,247,0.35); border-radius: 18px; padding: 18px 20px; font-size: 28px; color: #fff; font-weight: 500; line-height: 1.2; background: rgba(10,31,68,0.4); }
  .tip b { display: block; font-family: 'Barlow'; font-size: 22px; letter-spacing: 0.2em; color: #8FB5E8; margin-bottom: 8px; }
  .play { position: absolute; left: 50%; top: 820px; width: 150px; height: 150px; margin-left: -75px; border-radius: 50%;
    background: rgba(255,255,255,0.18); border: 3px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; }
  .play svg { width: 60px; height: 60px; margin-left: 8px; }
</style></head>
<body>
<div class="canvas">
  <div class="shade"></div>
  <div class="logo"><img src="../gillette-logo-white.png" alt="Gillette"></div>
  <div class="play"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6 4l14 8-14 8z"/></svg></div>
  <div class="num">3</div>
  <div class="title display">tips every first-time shaver needs<span>Your first shave, done right.</span></div>
  <div class="bar"></div>
  <div class="tips">
    <div class="tip"><b>TIP 1</b>Prep with warm water and gel</div>
    <div class="tip"><b>TIP 2</b>Light, gentle strokes</div>
    <div class="tip"><b>TIP 3</b>Rinse the razor often</div>
  </div>
</div>
</body></html>
